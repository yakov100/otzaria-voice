plugins {
    id 'com.android.application'
}

android {
    namespace 'org.otzaria.voice'
    compileSdk 35

    defaultConfig {
        applicationId 'org.otzaria.voice'
        minSdk 26          // AAudio for the microphone
        targetSdk 35
        // The service's version (kVersion in service.cpp): 2.5.1 is versionCode
        // 20501, so each release has a higher versionCode than the one before.
        def kVersion = file('../../src/common/service.cpp').text =~ /kVersion = "(\d+)\.(\d+)\.(\d+)"/
        if (!kVersion.find()) {
            throw new GradleException('service.cpp: no kVersion = "X.Y.Z"')
        }
        def (major, minor, patch) = (1..3).collect { kVersion.group(it) as int }
        if (minor > 99 || patch > 99) {
            throw new GradleException("kVersion $major.$minor.$patch: versionCode needs minor and patch below 100")
        }
        versionCode major * 10000 + minor * 100 + patch
        versionName "$major.$minor.$patch"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                // Static C++ runtime: no libc++_shared.so to clash with ONNX Runtime's.
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Microsoft's ONNX Runtime for Android: ships libonnxruntime.so, whose C API
    // the native service loads at run time (as Otzaria's copy on the desktop).
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.28.0'
}
