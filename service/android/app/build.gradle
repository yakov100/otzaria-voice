plugins {
    id 'com.android.application'
}

// The project's permanent signing key, so that a newer APK installs over an
// older one (Android refuses an update signed with another key). CI decodes it
// from the repository secrets into OTZARIA_KEYSTORE (see SIGNING.md). Without it
// (forks, local builds) the APK is signed with this machine's debug key.
def keystorePath = System.getenv('OTZARIA_KEYSTORE')
def keystorePassword = System.getenv('OTZARIA_KEYSTORE_PASSWORD')
if (keystorePath && !keystorePassword) {
    throw new GradleException('OTZARIA_KEYSTORE is set but OTZARIA_KEYSTORE_PASSWORD is not')
}

android {
    namespace 'org.otzaria.voice'
    compileSdk 35

    defaultConfig {
        applicationId 'org.otzaria.voice'
        minSdk 26          // AAudio for the microphone
        targetSdk 35
        versionCode 1
        versionName '1.1.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                // Static C++ runtime: no libc++_shared.so to clash with ONNX Runtime's.
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        if (keystorePath) {
            otzaria {
                storeFile file(keystorePath)
                storeType 'PKCS12'
                storePassword keystorePassword
                keyAlias System.getenv('OTZARIA_KEY_ALIAS') ?: 'otzaria-voice'
                keyPassword System.getenv('OTZARIA_KEY_PASSWORD') ?: keystorePassword
            }
        }
    }

    buildTypes {
        // CI ships the debug build; both build types use the same key.
        debug {
            if (keystorePath) {
                signingConfig signingConfigs.otzaria
            }
        }
        release {
            minifyEnabled false
            if (keystorePath) {
                signingConfig signingConfigs.otzaria
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Microsoft's ONNX Runtime for Android: ships libonnxruntime.so, whose C API
    // the native service loads at run time (as Otzaria's copy on the desktop).
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.28.0'
}
