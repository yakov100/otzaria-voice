name: תוסף חיפוש בדיבור (הכתבה)

# Validates and packs the plugin "חיפוש בדיבור (הכתבה)" (plugins/dictation/), uploads the .otzplugin as
# a workflow artifact, and on pushes to main whose version has no GitHub Release
# yet creates Release dictation-v<version> with the plugin file. That release is
# created with --latest=false: "latest" must stay the service release
# (service.yml), because the plugins download the installer from
# releases/latest/download/...
#
# Store publishing is unchanged: only on main, only with the store secrets
# OTZARIA_USER and OTZARIA_PASSWORD, and only when PUBLISH_DICTATION is "true"
# or the workflow is run by hand (Actions > Run workflow).
#
# The plugin is generated by plugins/dictation/build.py into two packages:
#   released  the store/release build; its manifest version is the release version
#   next      the slot for a build that needs an Otzaria newer than the released
#             one; built as an artifact only, never published or attached to a
#             release. Since 2.3.0 it is the same as "released".

on:
  push:
    branches: ['**']
    paths:
      - 'plugins/dictation/**'
      - '.github/workflows/dictation.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'פרסום לחנות אוצריא בענף main: auto (כשיש סודות) / true / false'
        default: 'auto'

permissions:
  contents: read

concurrency:
  group: dictation-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  plugin:
    name: תוסף (.otzplugin)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      minapp: ${{ steps.ver.outputs.minapp }}
    env:
      HAS_STORE_SECRETS: ${{ secrets.OTZARIA_USER != '' && secrets.OTZARIA_PASSWORD != '' }}
      PUBLISH: ${{ inputs.publish || 'auto' }}
      # The store is published to by hand (Run workflow) or when PUBLISH_DICTATION is "true".
      STORE_PUBLISH_ALLOWED: ${{ github.event_name == 'workflow_dispatch' || vars.PUBLISH_DICTATION == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: יצירת שתי חבילות התוסף
        run: python3 plugins/dictation/build.py

      # The official Otzaria action: the same checks as the store, and the .otzplugin.
      - name: גרסה
        id: ver
        run: |
          version="$(python3 -c "import json; print(json.load(open('plugins/dictation/packages/released/manifest.json', encoding='utf-8'))['version'])")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::גרסה לא תקינה בתוסף: '$version' (צפוי X.Y.Z)"; exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "minapp=$(python3 -c "import json; print(json.load(open('plugins/dictation/packages/released/manifest.json', encoding='utf-8'))['minAppVersion'])")" >>"$GITHUB_OUTPUT"

      - name: ולידציה ואריזה (released)
        id: build
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: plugins/dictation/packages/released
          build: 'true'
          publish: 'false'

      - name: העלאת התוסף
        uses: actions/upload-artifact@v7
        with:
          name: otzaria-voice-plugin
          path: ${{ steps.build.outputs.plugin-file }}
          if-no-files-found: error

      # "next" is for a build that needs an Otzaria newer than the released one
      # (today it is the same as "released"). Such a build may fail today's
      # validator, so this step may fail; it is packed anyway for testing, and
      # never published.
      - name: ולידציה (next) — מותר להיכשל
        id: next
        continue-on-error: true
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: plugins/dictation/packages/next
          build: 'true'
          publish: 'false'

      - name: אריזת next
        env:
          NEXT_OUTCOME: ${{ steps.next.outcome }}
          NEXT_FILE: ${{ steps.next.outputs.plugin-file }}
        run: |
          v="$(python3 -c "import json; print(json.load(open('plugins/dictation/packages/next/manifest.json', encoding='utf-8'))['version'])")"
          id="$(python3 -c "import json; print(json.load(open('plugins/dictation/packages/next/manifest.json', encoding='utf-8'))['id'])")"
          mkdir -p out
          target="out/$id-$v-next.otzplugin"
          if [ "$NEXT_OUTCOME" = success ] && [ -f "$NEXT_FILE" ]; then
            cp "$NEXT_FILE" "$target"
            echo "next: עבר ולידציה ונארז על ידי הכלי הרשמי."
          else
            echo "::warning::חבילת next ($v) לא עברה את כלי הוולידציה הנוכחי (היא מיועדת לגרסת אוצריא חדשה יותר מזו שבחנות). נארזה ידנית לבדיקה בלבד; לא תפורסם."
            (cd plugins/dictation/packages/next && zip -q -r -X "$GITHUB_WORKSPACE/$target" .)
          fi
          unzip -l "$target"

      - name: העלאת next
        uses: actions/upload-artifact@v7
        with:
          name: otzaria-voice-plugin-next
          path: out/*-next.otzplugin
          if-no-files-found: error

      - name: צילומי מסך לחנות
        id: shots
        run: |
          # Store screenshots live in screenshots/ at the repository root
          # (PNG/JPG, up to 10, in name order). The first store release needs at least one.
          list="$(ls screenshots/*.png screenshots/*.jpg screenshots/*.jpeg 2>/dev/null | sort | head -n 10 | paste -sd, - || true)"
          echo "list=$list" >>"$GITHUB_OUTPUT"
          echo "צילומי מסך: ${list:-אין}"

      - name: מצב הפרסום לחנות
        run: echo "event=${{ github.event_name }} ref=${{ github.ref }} store-secrets=$HAS_STORE_SECRETS publish-input=$PUBLISH store-publish-allowed=$STORE_PUBLISH_ALLOWED"

      - name: פרסום לחנות — לא בדחיפה רגילה
        if: github.ref == 'refs/heads/main' && env.HAS_STORE_SECRETS == 'true' && env.STORE_PUBLISH_ALLOWED != 'true'
        run: echo "::notice::התוסף לא פורסם לחנות - דחיפה רגילה ל-main בונה ויוצרת גרסה בגיטהאב בלבד. לפרסום לחנות - Actions, בנייה ואריזה, Run workflow בענף main (או המשתנה PUBLISH_DICTATION=true)."

      - name: פרסום לחנות — דילוג
        if: github.ref == 'refs/heads/main' && env.HAS_STORE_SECRETS != 'true'
        run: echo "::notice::פרסום לחנות אוצריא דולג - הסודות OTZARIA_USER ו-OTZARIA_PASSWORD לא הוגדרו במאגר (Settings > Secrets and variables > Actions)."

      # A store problem (login, metadata) must not hold back the GitHub
      # Release with the installers: the step warns and the run goes on.
      - name: פרסום לחנות אוצריא (released בלבד)
        if: github.ref == 'refs/heads/main' && env.HAS_STORE_SECRETS == 'true' && env.PUBLISH != 'false' && env.STORE_PUBLISH_ALLOWED == 'true'
        id: publish
        continue-on-error: true
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: plugins/dictation/packages/released
          otzaria-user: ${{ secrets.OTZARIA_USER }}
          otzaria-password: ${{ secrets.OTZARIA_PASSWORD }}
          publish: ${{ env.PUBLISH }}
          screenshots: ${{ steps.shots.outputs.list }}
          # Consent to receive user bug reports by e-mail; the store requires it
          # for a plugin's first release. Set the repository variable
          # OTZARIA_REPORTS_CONSENT=true to give it.
          reports-consent: ${{ vars.OTZARIA_REPORTS_CONSENT == 'true' && 'true' || 'false' }}

  release:
    name: GitHub Release (תוסף)
    needs: plugin
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !cancelled() && needs.plugin.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: dictation-v${{ needs.plugin.outputs.version }}
      LEGACY_TAG: v${{ needs.plugin.outputs.version }}
      MINAPP: ${{ needs.plugin.outputs.minapp }}
    steps:
      - name: האם ה-Release כבר קיים
        id: check
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
             gh release view "$LEGACY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ה-Release $TAG כבר קיים - מדלג (כדי לפרסם גרסה חדשה מעלים את version במניפסט של התוסף)."
            echo "exists=true" >>"$GITHUB_OUTPUT"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi

      - name: הורדת קובץ התוסף
        if: steps.check.outputs.exists == 'false'
        uses: actions/download-artifact@v8
        with:
          name: otzaria-voice-plugin
          path: files

      - name: יצירת ה-Release
        if: steps.check.outputs.exists == 'false'
        run: |
          ls -l files
          (cd files && sha256sum * >SHA256SUMS.txt)
          # --latest=false: the service release stays "latest" (the plugins fetch the installer from it).
          gh release create "$TAG" files/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "תוסף חיפוש בדיבור (הכתבה) $TAG" --latest=false \
            --notes "קובץ התוסף (.otzplugin) של חיפוש בדיבור (הכתבה). מתקינים מחנות התוספים של אוצריא, או מהקובץ: כלים ← תוספים ← התקנת תוסף חדש. התוסף דורש אוצריא $MINAPP ומעלה (באוצריא ישנה יותר מתקינים גרסה קודמת של התוסף מדף הגרסאות). התוסף צריך את שירות הדיבור: https://github.com/$GITHUB_REPOSITORY/releases/latest"
