name: שירות הדיבור — בנייה ואריזה

# The speech service shared by both plugins ("חיפוש בדיבור" and "הקראה קולית").
# On every push that touches service/ or installer/: builds it for Windows, Linux,
# macOS and Android, packages two installers per platform (with the voice pack /
# without it, downloading it later), installs each one on the runner and runs a
# real dictation through it (installer/ci/smoke-test.sh), and uploads everything
# as workflow artifacts. On pushes to main whose version (kVersion in
# service/src/common/service.cpp) has no GitHub Release yet, it also creates
# Release service-v<version> with all the installers.
#
# The plugins fetch the installer from releases/latest/download/..., and people
# the full one (with-models.exe), so THIS is the release that must stay marked
# "latest". The plugin workflows
# (dictation.yml, read-aloud.yml) create their releases with --latest=false.
#
# A platform whose sources are missing is skipped, not failed:
#   Windows  service/CMakeLists.txt (via service/build.cmd)
#   Linux    service/CMakeLists.txt
#   macOS    service/CMakeLists.txt  (arm64: ONNX Runtime 1.28.0 has no x86_64 macOS build)
#   Android  service/android (Gradle project, module "app")

on:
  push:
    branches: ['**']
    paths:
      - 'service/**'
      - 'installer/**'
      - '.github/workflows/service.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  PACK_CACHE_KEY: voice-pack-v4-6ae8112931042ee86889336418a111de90f73e3d5bdac5ce361e24955358f048

jobs:
  detect:
    name: זיהוי גרסה ומקורות
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.d.outputs.version }}
      cmake: ${{ steps.d.outputs.cmake }}
      android: ${{ steps.d.outputs.android }}
    steps:
      - uses: actions/checkout@v7
      - id: d
        name: גרסה ומה אפשר לבנות
        run: |
          version="$(grep -oP 'kVersion = "\K[^"]+' service/src/common/service.cpp)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::גרסת שירות לא תקינה ב-service.cpp: '$version' (צפוי X.Y.Z)"; exit 1
          fi
          cmake=false; [ -f service/CMakeLists.txt ] && cmake=true
          android=false
          if [ -f service/android/settings.gradle ] || [ -f service/android/settings.gradle.kts ]; then android=true; fi
          {
            echo "version=$version"
            echo "cmake=$cmake"
            echo "android=$android"
          } >>"$GITHUB_OUTPUT"
          echo "גרסה: $version | CMake: $cmake | Android: $android"
          [ "$cmake" = true ] || echo "::notice::אין service/CMakeLists.txt: Linux ו-macOS ידולגו."
          [ "$android" = true ] || echo "::notice::אין פרויקט Android בתיקייה service/android: בניית Android תדולג."

  windows:
    name: Windows x64
    needs: [detect, windows-arm64-build]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: בניית השירות
        shell: pwsh
        run: |
          # service/build.cmd: CMake + Visual Studio, result in service\out\otzaria-voice.exe.
          cmd /c service\build.cmd
          if ($LASTEXITCODE) { exit 1 }
          ctest --test-dir service/out/build -C Release --output-on-failure -V
          if ($LASTEXITCODE) { exit 1 }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item service/out/otzaria-voice.exe dist/otzaria-voice.exe
          Get-Item dist/otzaria-voice.exe | Format-List Name, Length

      # Windows on ARM: the ARM64 build rides in the same installers (handoff.h).
      - uses: actions/download-artifact@v8
        with:
          name: otzaria-voice-windows-arm64-exe
          path: dist

      # Only for the smoke test: on users' machines the service uses Otzaria's copy.
      - name: ONNX Runtime (לבדיקה בלבד)
        shell: bash
        run: |
          d="$(bash installer/fetch-ort.sh win-x64 "$RUNNER_TEMP/ort")"
          echo "OTZARIA_ORT_PATH=$(cygpath -w "$d/lib/onnxruntime.dll")" >>"$GITHUB_ENV"

      - name: מטמון חבילת הקול
        uses: actions/cache@v6
        with:
          path: .cache/voice-pack
          key: ${{ env.PACK_CACHE_KEY }}
      - name: הורדת חבילת הקול ואימותה
        shell: bash
        run: bash installer/fetch-pack.sh .cache/voice-pack dist/pack

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}", $env:ProgramFiles -Filter ISCC.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE) { exit 1 }
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}", $env:ProgramFiles -Filter ISCC.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { Write-Error 'ISCC.exe not found'; exit 1 }
          "ISCC=$($iscc.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: בניית המתקינים
        shell: pwsh
        run: |
          $common = @("/DAppVersion=$env:VERSION", "/DSourceExe=$pwd\dist\otzaria-voice.exe",
                      "/DSourceExeArm64=$pwd\dist\otzaria-voice-arm64.exe", "/O$pwd\out")
          & $env:ISCC /Qp @common installer\windows\otzaria-voice.iss
          if ($LASTEXITCODE) { exit 1 }
          & $env:ISCC /Qp @common "/DPackDir=$pwd\dist\pack" installer\windows\otzaria-voice.iss
          if ($LASTEXITCODE) { exit 1 }
          # The same file under a name without the version: the plugins fetch
          # it as releases/latest/download/otzaria-voice-windows-x64-without-models.exe.
          Copy-Item "out\otzaria-voice-windows-x64-without-models-$env:VERSION.exe" out\otzaria-voice-windows-x64-without-models.exe
          Get-ChildItem out | Format-Table Name, Length

      - name: בדיקת התקנה שקטה
        shell: pwsh
        timeout-minutes: 15
        run: |
          # Start-Process -Wait would also wait for the service the installer
          # starts (it never exits), so wait for the process itself only.
          function Invoke-Wait($file, $argList) {
            $p = Start-Process $file -ArgumentList $argList -PassThru
            $null = $p.Handle  # keeps ExitCode readable after exit
            if (-not $p.WaitForExit(600000)) { Write-Error "$file did not finish in 10 minutes"; exit 1 }
            return $p.ExitCode
          }
          $dir = "$env:LOCALAPPDATA\Programs\OtzariaVoice"
          $pack = "$env:APPDATA\otzaria\stt\pack"
          foreach ($variant in 'without-models', 'with-models') {
            $setup = Get-Item "out\otzaria-voice-windows-x64-$variant-$env:VERSION.exe"
            $code = Invoke-Wait $setup.FullName @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$pwd\install-$variant.log")
            Get-Content "install-$variant.log" -Tail 15
            if ($code -ne 0) { Get-Content "install-$variant.log"; Write-Error "$variant setup exited $code"; exit 1 }
            if (-not (Test-Path "$dir\otzaria-voice.exe")) { Write-Error "$variant`: exe not installed"; exit 1 }
            if (Test-Path "$dir\otzaria-voice-arm64.exe") { Write-Error "$variant`: the ARM64 build was installed on x64"; exit 1 }
            $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name OtzariaVoice -ErrorAction SilentlyContinue
            if (-not $run) { Write-Error "$variant`: login start not registered"; exit 1 }
            if (-not (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\OtzariaVoice')) { Write-Error "$variant`: no Installed-apps entry"; exit 1 }
            Write-Host "$variant`: installed, login start = $($run.OtzariaVoice)"
          }
          foreach ($f in 'ctc\model.int8.onnx', 'ctc\vocab.json', 'ctc\preprocessor.json', 'lm\library.otzlm', 'LICENSES.txt', 'version.txt') {
            if (-not (Test-Path "$pack\$f")) { Write-Error "voice pack: missing $f"; exit 1 }
          }
          $want = [regex]::Match((Get-Content "$env:GITHUB_WORKSPACE\service\src\common\pack.cpp" -Raw), 'kRelease = \{\s*(\d+),').Groups[1].Value
          if (-not $want) { Write-Error 'voice pack: cannot read the version from pack.cpp'; exit 1 }
          if ((Get-Content "$pack\version.txt" -Raw).Trim() -ne $want) { Write-Error "voice pack: version.txt is not $want"; exit 1 }
          Write-Host 'voice pack installed'

      - name: הכתבה דרך השירות המותקן
        shell: bash
        timeout-minutes: 10
        run: EXPECT_ARCH=x64 bash installer/ci/smoke-test.sh "$LOCALAPPDATA/Programs/OtzariaVoice/otzaria-voice.exe"

      - name: בדיקת הסרה
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\OtzariaVoice"
          $p = Start-Process "$dir\otzaria-voice.exe" -ArgumentList '--uninstall', '--quiet' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { Write-Error 'uninstall did not finish'; exit 1 }
          $code = $p.ExitCode
          if ($code -ne 0) { Write-Error "uninstall exited $code"; exit 1 }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\OtzariaVoice') { Write-Error 'uninstall left the Installed-apps entry'; exit 1 }
          Write-Host 'uninstalled'

      - name: העלאה — עם מודלים
        uses: actions/upload-artifact@v7
        with:
          name: otzaria-voice-windows-x64-with-models
          path: out/otzaria-voice-windows-x64-with-models-*.exe
          compression-level: 0
          if-no-files-found: error
      - name: העלאה — בלי מודלים
        uses: actions/upload-artifact@v7
        with:
          name: otzaria-voice-windows-x64-without-models
          path: out/otzaria-voice-windows-x64-without-models*.exe
          if-no-files-found: error

  # Otzaria no longer installs the Visual C++ runtime into Windows: its copies
  # lie next to otzaria.exe, one folder above onnxruntime\. On a machine where
  # nothing else installed it, 2.5.1 failed with "cannot load
  # ...\Otzaria\onnxruntime\onnxruntime.dll". This job makes such a machine
  # (Otzaria's layout, the runtime hidden from System32 and from PATH): the
  # released 2.5.1 must fail there, and this build must dictate.
  windows-no-vcredist:
    name: Windows x64 — בלי Visual C++ במערכת
    needs: [detect, windows]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: otzaria-voice-windows-x64-with-models
          path: setup

      - name: ONNX Runtime ו-Visual C++ בפריסה של אוצריא
        shell: bash
        run: |
          d="$(bash installer/fetch-ort.sh win-x64 "$RUNNER_TEMP/ort")"
          otz="$(cygpath -u "$LOCALAPPDATA")/Programs/Otzaria"
          mkdir -p "$otz/onnxruntime"
          cp "$d/lib/onnxruntime.dll" "$otz/onnxruntime/"
          for f in msvcp140.dll msvcp140_1.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "/c/Windows/System32/$f" "$otz/$f"
          done
          ls -l "$otz" "$otz/onnxruntime"

      - name: התקנת 2.5.1 (מהשחרור) ואחריה הבנייה הזו
        shell: pwsh
        run: |
          function Invoke-Wait($file, $argList) {
            $p = Start-Process $file -ArgumentList $argList -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(600000)) { Write-Error "$file did not finish in 10 minutes"; exit 1 }
            return $p.ExitCode
          }
          $silent = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
          $dir = "$env:LOCALAPPDATA\Programs\OtzariaVoice"
          gh release download service-v2.5.1 --repo $env:GITHUB_REPOSITORY --pattern 'otzaria-voice-windows-x64-without-models-2.5.1.exe' --dir old
          if ($LASTEXITCODE) { exit 1 }
          $code = Invoke-Wait (Get-Item old\*.exe).FullName $silent
          if ($code -ne 0) { Write-Error "2.5.1 setup exited $code"; exit 1 }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\old" | Out-Null
          Copy-Item "$dir\otzaria-voice.exe" "$env:RUNNER_TEMP\old\otzaria-voice.exe"
          $setup = Get-Item "setup\otzaria-voice-windows-x64-with-models-$env:VERSION.exe"
          $code = Invoke-Wait $setup.FullName $silent
          if ($code -ne 0) { Write-Error "setup exited $code"; exit 1 }
          Get-FileHash "$env:RUNNER_TEMP\old\otzaria-voice.exe", "$dir\otzaria-voice.exe" | Format-Table Hash, Path

      # Launchers that run each service with PATH = System32 and Windows only
      # (2.5.1 also searched PATH).
      - name: כלים לבדיקות
        shell: bash
        run: |
          for v in "old $(cygpath -u "$RUNNER_TEMP")/old/otzaria-voice.exe" \
                   "new $(cygpath -u "$LOCALAPPDATA")/Programs/OtzariaVoice/otzaria-voice.exe"; do
            set -- $v
            printf '#!/usr/bin/env bash\nPATH=/c/Windows/System32:/c/Windows exec "%s" "$@"\n' "$2" >"$1.sh"
            chmod +x "$1.sh"
          done

      - name: 2.5.1 עובר כשיש Visual C++ במערכת (ביקורת)
        shell: bash
        run: |
          bash installer/ci/smoke-test.sh ./old.sh
          bash installer/ci/stop-service.sh

      - name: הסתרת Visual C++ מ-System32
        shell: pwsh
        run: |
          $sys = "$env:SystemRoot\System32"
          foreach ($f in 'msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            $p = Join-Path $sys $f
            if (-not (Test-Path $p)) { continue }
            takeown /f $p | Out-Null
            icacls $p /grant '*S-1-5-32-544:F' | Out-Null
            Rename-Item $p "$f.hidden"
            if (Test-Path $p) { Write-Error "$f is still in System32"; exit 1 }
          }
          # 2.5.1 also searched the Windows folder, its 16-bit system folder and PATH
          # (the launchers keep PATH to System32 and Windows).
          foreach ($d in $sys, $env:SystemRoot, "$env:SystemRoot\System") {
            if (-not (Test-Path $d)) { continue }
            $left = Get-ChildItem $d -File | Where-Object { $_.Name -match '^(msvcp140(_1)?|vcruntime140(_1)?)\.dll$' }
            if ($left) { Write-Error "left in $d`: $($left.Name -join ', ')"; exit 1 }
          }
          Write-Host 'Visual C++ runtime hidden from System32'

      - name: 2.5.1 נכשל (שחזור התקלה)
        shell: bash
        run: |
          code=0
          bash installer/ci/smoke-test.sh ./old.sh >old.out 2>&1 || code=$?
          cat old.out
          bash installer/ci/stop-service.sh
          [ "$code" -ne 0 ] || { echo "::error::2.5.1 passed: this machine does not reproduce the bug"; exit 1; }
          grep -q 'cannot load .*Otzaria.*onnxruntime\.dll' old.out ||
            { echo "::error::2.5.1 failed, but not with cannot load ...Otzaria\\onnxruntime\\onnxruntime.dll"; exit 1; }
          echo "reproduced: 2.5.1 cannot load Otzaria's ONNX Runtime"

      - name: הבנייה הזו מכתיבה
        shell: bash
        run: |
          bash installer/ci/smoke-test.sh ./new.sh
          bash installer/ci/stop-service.sh
          line="$(grep -a 'Visual C++ runtime from' "$(cygpath -u "$LOCALAPPDATA")/OtzariaVoice/service.log" | tail -1)"
          echo "$line"
          grep -qi 'from .*Programs.Otzaria.VCRUNTIME140\.dll and .*Programs.Otzaria.MSVCP140\.dll' <<<"$line" ||
            { echo "::error::the Visual C++ runtime did not come from Otzaria's folder"; exit 1; }

      - name: בלי Visual C++ גם אצל אוצריא, ההודעה כוללת את קוד השגיאה
        shell: bash
        run: |
          otz="$(cygpath -u "$LOCALAPPDATA")/Programs/Otzaria"
          for f in msvcp140.dll msvcp140_1.dll vcruntime140.dll vcruntime140_1.dll; do mv "$otz/$f" "$otz/$f.hidden"; done
          code=0
          bash installer/ci/smoke-test.sh ./new.sh >new.out 2>&1 || code=$?
          cat new.out
          bash installer/ci/stop-service.sh
          [ "$code" -ne 0 ] || { echo "::error::dictated with no Visual C++ anywhere"; exit 1; }
          grep -q 'cannot load .*onnxruntime\.dll (Windows error 126)' new.out ||
            { echo "::error::the message has no Windows error 126"; exit 1; }

      # A damaged ONNX Runtime must come back as an error, not as a "Bad Image"
      # box that holds the load until someone closes it (SetThreadErrorMode in
      # platform.cpp). 2.5.1 runs too, for comparison only: if it hangs and
      # this build does not, the box was there and is gone.
      - name: קובץ ORT פגום — שגיאה ולא חלון
        shell: bash
        timeout-minutes: 5
        run: |
          f="$(cygpath -u "$RUNNER_TEMP")/damaged/onnxruntime.dll"; mkdir -p "$(dirname "$f")"
          python -I -c "import sys; b = bytearray(0x86); b[0:2] = b'MZ'; b[60] = 0x80; b[0x80:0x84] = b'PE\0\0'; b[0x84:0x86] = (0xAA64).to_bytes(2, 'little'); open(sys.argv[1], 'wb').write(b)" "$f"
          export OTZARIA_ORT_PATH="$(cygpath -w "$f")"
          log="$(cygpath -u "$LOCALAPPDATA")/OtzariaVoice/service.log"
          for exe in old new; do
            code=0
            timeout 60 "./$exe.sh" --eval "$(cygpath -w "$PWD/none.jsonl")" "$(cygpath -w "$PWD/none-out.jsonl")" || code=$?
            echo "$exe: exit $code; log: $(tail -1 "$log")"
            if [ "$exe" = new ]; then
              [ "$code" -ne 124 ] || { echo "::error::this build hung on a damaged library"; exit 1; }
              tail -1 "$log" | grep -q 'cannot load .*damaged.*(Windows error' ||
                { echo "::error::no Windows error for the damaged library"; exit 1; }
            fi
          done

  # Windows on ARM (service/src/common/handoff.h): Otzaria's ARM build carries
  # an ARM64 ONNX Runtime, which an x64 program cannot load. The ARM64 build
  # of the service is made here, natively, and rides in the x64 job's installers.
  windows-arm64-build:
    name: Windows ARM64 — בנייה
    needs: detect
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: בניית השירות (ARM64) ובדיקות היחידה
        shell: pwsh
        env:
          OTZARIA_VOICE_ARCH: ARM64
        run: |
          cmd /c service\build.cmd
          if ($LASTEXITCODE) { exit 1 }
          ctest --test-dir service/out/build-arm64 -C Release --output-on-failure -V
          if ($LASTEXITCODE) { exit 1 }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item service/out/otzaria-voice-arm64.exe dist/
          Get-Item dist/otzaria-voice-arm64.exe | Format-List Name, Length
          python -I installer/ci/pe-imports.py dist/otzaria-voice-arm64.exe | Select-Object -First 1

      # Only for the tests: on users' machines the service uses Otzaria's copy.
      - name: ONNX Runtime ל-ARM64 (לבדיקה בלבד)
        shell: bash
        run: |
          d="$(bash installer/fetch-ort.sh win-arm64 "$RUNNER_TEMP/ort")"
          # The folder added to the DLL search is removed right after the load:
          # only safe for a library that loads nothing later.
          python -I installer/ci/pe-imports.py "$d/lib/onnxruntime.dll" --no-delay
          echo "OTZARIA_ORT_PATH=$(cygpath -w "$d/lib/onnxruntime.dll")" >>"$GITHUB_ENV"

      - name: מטמון חבילת הקול
        uses: actions/cache@v6
        with:
          path: .cache/voice-pack
          key: ${{ env.PACK_CACHE_KEY }}
      - name: הורדת חבילת הקול ואימותה
        shell: bash
        run: |
          bash installer/fetch-pack.sh .cache/voice-pack dist/pack
          echo "OTZARIA_VOICE_PACK_DIR=$(cygpath -w "$PWD/dist/pack")" >>"$GITHUB_ENV"

      - name: הכתבה בבנייה ל-ARM64
        shell: bash
        timeout-minutes: 10
        run: |
          EXPECT_ARCH=arm64 bash installer/ci/smoke-test.sh dist/otzaria-voice-arm64.exe
          bash installer/ci/stop-service.sh

      - name: העלאה
        uses: actions/upload-artifact@v7
        with:
          name: otzaria-voice-windows-arm64-exe
          path: dist/otzaria-voice-arm64.exe
          if-no-files-found: error

  # The installers on a Windows on ARM machine, with Otzaria's layout made by
  # hand (%LOCALAPPDATA%\Programs\Otzaria: ONNX Runtime in onnxruntime\, the
  # Visual C++ runtime of the same processor next to it, as Otzaria ships them).
  windows-arm64-test:
    name: Windows ARM64 — התקנה והחלפת גרסה
    needs: [detect, windows]
    runs-on: windows-11-arm
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: otzaria-voice-windows-x64-with-models
          path: setup

      # The Visual C++ runtime as each Otzaria build ships it: the ARM build
      # copies the ARM runner's System32 (Otzaria's build-and-announce.yml);
      # the x64 files come from Visual Studio's redistributable folder.
      - name: קובצי Visual C++ לשני המעבדים
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $x64 = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT\vcruntime140.dll" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $x64) { Write-Error "no x64 Visual C++ runtime under $vs\VC\Redist\MSVC"; exit 1 }
          $from = @{ arm64 = "$env:SystemRoot\System32"; x64 = $x64.DirectoryName }
          foreach ($arch in 'arm64', 'x64') {
            $dst = "$env:RUNNER_TEMP\layout\$arch"
            New-Item -ItemType Directory -Force "$dst\onnxruntime" | Out-Null
            Copy-Item "$($from[$arch])\msvcp140.dll", "$($from[$arch])\msvcp140_1.dll", "$($from[$arch])\vcruntime140*.dll" $dst
            Write-Host "$arch runtime from $($from[$arch]):"
            Get-ChildItem $dst -File | ForEach-Object { "  $($_.Name) $($_.VersionInfo.FileVersion)" }
          }
      - name: ONNX Runtime לשני המעבדים
        shell: bash
        run: |
          for a in arm64 x64; do
            d="$(bash installer/fetch-ort.sh win-$a "$RUNNER_TEMP/ort-$a")"
            cp "$d/lib/onnxruntime.dll" "$(cygpath -u "$RUNNER_TEMP")/layout/$a/onnxruntime/"
          done
          # otzaria.sh <arm64|x64>: Otzaria's folder as the build for that processor leaves it.
          cat >"$RUNNER_TEMP/otzaria.sh" <<'EOF'
          set -euo pipefail
          otz="$(cygpath -u "$LOCALAPPDATA")/Programs/Otzaria"
          rm -rf "$otz"; mkdir -p "$otz"
          cp -r "$(cygpath -u "$RUNNER_TEMP")/layout/$1/." "$otz/"
          python -I installer/ci/pe-imports.py "$otz/onnxruntime/onnxruntime.dll" | grep -q ": $1\$" ||
            { echo "::error::Otzaria layout: the ONNX Runtime is not $1"; exit 1; }
          echo "Otzaria layout: $1"
          EOF
          # runtime-from.sh: the last load in the log took the Visual C++ runtime
          # from Otzaria's folder, by the new search (not the old one).
          cat >"$RUNNER_TEMP/runtime-from.sh" <<'EOF'
          line="$(grep -a 'Visual C++ runtime from' "$(cygpath -u "$LOCALAPPDATA")/OtzariaVoice/service.log" | tail -1)"
          echo "$line"
          if ! grep -qi 'from .*Programs.Otzaria.VCRUNTIME140\.dll and .*Programs.Otzaria.MSVCP140\.dll' <<<"$line" ||
             grep -q '(old search)' <<<"$line"; then
            echo "::error::the Visual C++ runtime did not come from Otzaria's folder by the new search"; exit 1
          fi
          EOF

      - name: התקנת 2.5.1 (מהשחרור)
        shell: pwsh
        run: |
          gh release download service-v2.5.1 --repo $env:GITHUB_REPOSITORY --pattern 'otzaria-voice-windows-x64-without-models-2.5.1.exe' --dir old
          if ($LASTEXITCODE) { exit 1 }
          $p = Start-Process (Get-Item old\*.exe).FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(600000)) { Write-Error '2.5.1 setup did not finish'; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "2.5.1 setup exited $($p.ExitCode)"; exit 1 }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\old" | Out-Null
          Copy-Item "$env:LOCALAPPDATA\Programs\OtzariaVoice\otzaria-voice.exe" "$env:RUNNER_TEMP\old\"

      # Before 2.5.1's runs: this installer brings the voice pack, which both
      # builds read from %APPDATA%; 2.5.1's exe was copied aside above.
      - name: התקנה (with-models) של הבנייה הזו
        shell: pwsh
        run: |
          $setup = Get-Item "setup\otzaria-voice-windows-x64-with-models-$env:VERSION.exe"
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$pwd\install.log" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(600000)) { Write-Error 'setup did not finish'; exit 1 }
          Get-Content install.log -Tail 15
          if ($p.ExitCode -ne 0) { Write-Error "setup exited $($p.ExitCode)"; exit 1 }
          $dir = "$env:LOCALAPPDATA\Programs\OtzariaVoice"
          foreach ($f in 'otzaria-voice.exe', 'otzaria-voice-arm64.exe') {
            if (-not (Test-Path "$dir\$f")) { Write-Error "$f not installed"; exit 1 }
          }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name OtzariaVoice).OtzariaVoice
          if ($run -ne "`"$dir\otzaria-voice.exe`"") { Write-Error "login start is $run"; exit 1 }
          Write-Host "installed both builds; login start = $run"

      - name: 2.5.1 (x64 בלבד) לא טוען את ה-ORT של ARM64 (שחזור התקלה)
        shell: bash
        run: |
          old="$(cygpath -u "$RUNNER_TEMP")/old"
          bash installer/ci/stop-service.sh 47811
          bash "$RUNNER_TEMP/otzaria.sh" x64
          # Positive control. 2.5.1 never searches Otzaria's root, only the
          # library's folder, System32 and PATH: the x64 runtime goes next to
          # the library too, so the result depends only on what this test laid out.
          cp "$(cygpath -u "$RUNNER_TEMP")/layout/x64/"*.dll "$(cygpath -u "$LOCALAPPDATA")/Programs/Otzaria/onnxruntime/"
          bash installer/ci/smoke-test.sh "$old/otzaria-voice.exe"
          bash installer/ci/stop-service.sh
          bash "$RUNNER_TEMP/otzaria.sh" arm64
          code=0
          bash installer/ci/smoke-test.sh "$old/otzaria-voice.exe" >old.out 2>&1 || code=$?
          cat old.out
          bash installer/ci/stop-service.sh
          [ "$code" -ne 0 ] || { echo "::error::2.5.1 loaded the ARM64 ONNX Runtime: this does not reproduce the bug"; exit 1; }
          grep -q 'cannot load .*Otzaria.*onnxruntime\.dll' old.out ||
            { echo "::error::2.5.1 failed, but not with cannot load ...Otzaria\\onnxruntime\\onnxruntime.dll"; exit 1; }
          echo "reproduced: x64 2.5.1 cannot load Otzaria's ARM64 ONNX Runtime"

      - name: אוצריא ARM64 — הגרסה ל-ARM64 עונה, גם להכתבה וגם ל-eval
        shell: bash
        timeout-minutes: 10
        run: |
          bash installer/ci/stop-service.sh 47811
          bash "$RUNNER_TEMP/otzaria.sh" arm64
          EXPECT_ARCH=arm64 bash installer/ci/smoke-test.sh "$(cygpath -u "$LOCALAPPDATA")/Programs/OtzariaVoice/otzaria-voice.exe"
          bash installer/ci/stop-service.sh
          grep -a 'handoff to .*otzaria-voice-arm64.exe: serving' "$(cygpath -u "$LOCALAPPDATA")/OtzariaVoice/service.log" | tail -1
          bash "$RUNNER_TEMP/runtime-from.sh"

      - name: אוצריא x64 במחשב ARM — גרסת x64 עונה
        shell: bash
        timeout-minutes: 10
        run: |
          bash "$RUNNER_TEMP/otzaria.sh" x64
          EXPECT_ARCH=x64 bash installer/ci/smoke-test.sh "$(cygpath -u "$LOCALAPPDATA")/Programs/OtzariaVoice/otzaria-voice.exe"
          bash installer/ci/stop-service.sh
          bash "$RUNNER_TEMP/runtime-from.sh"

      # Otzaria's update moves an x64 install to the ARM build while the
      # service runs: the next load fails (193) and the service restarts
      # through the x64 build, which hands over to the ARM64 one.
      - name: אוצריא מחליפה מעבד בזמן ריצה
        shell: bash
        timeout-minutes: 5
        run: |
          dir="$(cygpath -u "$LOCALAPPDATA")/Programs/OtzariaVoice"
          h=(-H 'X-Otzaria-Voice: 1'); s=http://127.0.0.1:47899
          python -I -c "import wave,struct,random,sys; random.seed(1); w=wave.open(sys.argv[1],'wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000); w.writeframes(b''.join(struct.pack('<h', random.randint(-60,60)) for _ in range(24000))); w.close()" quiet.wav
          export OTZARIA_VOICE_PORT=47899 OTZARIA_VOICE_TEST_WAV="$(cygpath -w "$PWD/quiet.wav")"
          bash "$RUNNER_TEMP/otzaria.sh" x64
          "$dir/otzaria-voice.exe" --serve &
          for _ in $(seq 1 30); do st="$(curl -sf "${h[@]}" "$s/status" || true)"; [ -n "$st" ] && break; sleep 1; done
          grep -q '"arch":"x64"' <<<"$st" || { echo "::error::x64 should serve first: $st"; exit 1; }
          bash "$RUNNER_TEMP/otzaria.sh" arm64   # nothing loaded yet: the files can be replaced
          out="$(curl -sN "${h[@]}" -H 'Content-Type: application/json' --max-time 60 -d '{"noSpeechMs":1500,"endAfterSilenceMs":1500}' "$s/dictate" || true)"
          echo "$out"
          grep -q 'מתחלף' <<<"$out" || { echo "::error::no switching message"; exit 1; }
          st=""
          for _ in $(seq 1 40); do st="$(curl -sf "${h[@]}" "$s/status" || true)"; grep -q '"arch":"arm64"' <<<"$st" && break; sleep 1; done
          echo "$st"
          grep -q '"arch":"arm64"' <<<"$st" || { echo "::error::the ARM64 build did not take over"; exit 1; }
          # The x64 parent leaves just after the ARM64 build takes the port.
          for _ in $(seq 1 10); do
            pids="$(tasklist //FI "IMAGENAME eq otzaria-voice*" //FO CSV //NH | grep '"otzaria-voice' | cut -d, -f2 || true)"
            [ "$(grep -c . <<<"$pids")" -eq 1 ] && break
            sleep 0.5
          done
          echo "service processes: $pids"
          [ "$(grep -c . <<<"$pids")" -eq 1 ] || { echo "::error::not exactly one service process"; exit 1; }
          bash installer/ci/stop-service.sh

      # The other build does not start serving (played here by a program that
      # exits at once): x64 serves, and the ARM64 library is reported with a
      # message instead of restarting over and over.
      - name: הגרסה השנייה לא עולה — הודעה, בלי לולאה
        shell: bash
        timeout-minutes: 5
        run: |
          dir="$(cygpath -u "$LOCALAPPDATA")/Programs/OtzariaVoice"
          mv "$dir/otzaria-voice-arm64.exe" "$dir/otzaria-voice-arm64.exe.real"
          cp /c/Windows/System32/hostname.exe "$dir/otzaria-voice-arm64.exe"
          h=(-H 'X-Otzaria-Voice: 1'); s=http://127.0.0.1:47899
          export OTZARIA_VOICE_PORT=47899 OTZARIA_VOICE_TEST_WAV="$(cygpath -w "$PWD/quiet.wav")"
          bash "$RUNNER_TEMP/otzaria.sh" arm64
          "$dir/otzaria-voice.exe" --serve &
          for _ in $(seq 1 30); do st="$(curl -sf "${h[@]}" "$s/status" || true)"; [ -n "$st" ] && break; sleep 1; done
          grep -q '"arch":"x64"' <<<"$st" || { echo "::error::x64 should serve after the failed handoff: $st"; exit 1; }
          pids() { tasklist //FI "IMAGENAME eq otzaria-voice*" //FO CSV //NH | grep '"otzaria-voice' | cut -d, -f2 || true; }
          before="$(pids)"
          [ "$(grep -c . <<<"$before")" -eq 1 ] || { echo "::error::not exactly one service process: $before"; exit 1; }
          out="$(curl -sN "${h[@]}" -H 'Content-Type: application/json' --max-time 60 -d '{"noSpeechMs":1500,"endAfterSilenceMs":1500}' "$s/dictate" || true)"
          echo "$out"
          grep -q 'התקינו מחדש' <<<"$out" || { echo "::error::no reinstall message"; exit 1; }
          sleep 5
          after="$(pids)"
          echo "before: $before"; echo "after: $after"
          [ "$before" = "$after" ] || { echo "::error::the service restarted"; exit 1; }
          bash installer/ci/stop-service.sh
          mv -f "$dir/otzaria-voice-arm64.exe.real" "$dir/otzaria-voice-arm64.exe"

      - name: הסרה מוחקת את שתי הגרסאות
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\OtzariaVoice"
          $p = Start-Process "$dir\otzaria-voice.exe" -ArgumentList '--uninstall', '--quiet' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { Write-Error 'uninstall did not finish'; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "uninstall exited $($p.ExitCode)"; exit 1 }
          for ($i = 0; $i -lt 30 -and (Test-Path $dir); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $dir) { Get-ChildItem $dir; Write-Error 'the install folder is still there'; exit 1 }
          Write-Host 'both builds and the folder removed'

  linux:
    name: Linux ${{ matrix.arch }}
    needs: detect
    if: needs.detect.outputs.cmake == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x64, ort: linux-x64 }
          - { runner: ubuntu-24.04-arm, arch: arm64, ort: linux-aarch64 }
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: כלי בנייה
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build desktop-file-utils

      - name: בניית השירות
        run: |
          cmake -S service -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          mkdir -p dist
          cp build/otzaria-voice dist/otzaria-voice
          file dist/otzaria-voice
          dist/otzaria-voice --version

      - name: ONNX Runtime
        run: echo "ORT_DIR=$(bash installer/fetch-ort.sh ${{ matrix.ort }} "$RUNNER_TEMP/ort")" >>"$GITHUB_ENV"

      - name: מטמון חבילת הקול
        uses: actions/cache@v6
        with:
          path: .cache/voice-pack
          key: ${{ env.PACK_CACHE_KEY }}
      - name: הורדת חבילת הקול ואימותה
        run: bash installer/fetch-pack.sh .cache/voice-pack dist/pack

      - name: אריזה (.deb ו-.tar.gz)
        run: |
          args=(--bin dist/otzaria-voice --version "$VERSION" --arch ${{ matrix.arch }} --ort "$ORT_DIR")
          bash installer/linux/package.sh "${args[@]}" --out out/without-models
          bash installer/linux/package.sh "${args[@]}" --out out/with-models --pack dist/pack
          ls -l out/*

      - name: בדיקת ההתקנה (deb)
        run: |
          deb="$(ls out/with-models/*.deb)"
          dpkg-deb -I "$deb"
          sudo apt-get install -y -q "./$deb"
          test -x /usr/bin/otzaria-voice
          test -e /usr/lib/otzaria-voice/libonnxruntime.so.1
          test -f /usr/share/otzaria-voice/pack/ctc/model.int8.onnx
          desktop-file-validate /etc/xdg/autostart/org.otzaria.voice.desktop
          /usr/bin/otzaria-voice --version

      - name: הכתבה דרך השירות המותקן
        timeout-minutes: 10
        run: bash installer/ci/smoke-test.sh /usr/bin/otzaria-voice

      - name: בדיקת הסרה וחבילה למשתמש (tar.gz)
        run: |
          sudo apt-get remove -y -q otzaria-voice
          test ! -e /usr/bin/otzaria-voice
          mkdir -p "$RUNNER_TEMP/tar" && tar -xzf out/without-models/*.tar.gz -C "$RUNNER_TEMP/tar"
          "$RUNNER_TEMP/tar/otzaria-voice/install.sh"
          test -x "$HOME/.local/bin/otzaria-voice" && test -f "$HOME/.config/autostart/org.otzaria.voice.desktop"
          "$HOME/.local/bin/otzaria-voice" --version
          "$RUNNER_TEMP/tar/otzaria-voice/install.sh" --uninstall
          test ! -e "$HOME/.local/bin/otzaria-voice"

      - name: העלאה — עם מודלים
        uses: actions/upload-artifact@v7
        with:
          name: otzaria-voice-linux-${{ matrix.arch }}-with-models
          path: out/with-models/*
          compression-level: 0
          if-no-files-found: error
      - name: העלאה — בלי מודלים
        uses: actions/upload-artifact@v7
        with:
          name: otzaria-voice-linux-${{ matrix.arch }}-without-models
          path: out/without-models/*
          if-no-files-found: error

  macos:
    name: macOS arm64
    needs: detect
    if: needs.detect.outputs.cmake == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: בניית השירות
        run: |
          command -v ninja >/dev/null || brew install ninja
          cmake -S service -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --parallel
          mkdir -p dist
          cp build/otzaria-voice dist/otzaria-voice
          file dist/otzaria-voice
          dist/otzaria-voice --version

      - name: ONNX Runtime
        run: echo "ORT_DIR=$(bash installer/fetch-ort.sh osx-arm64 "$RUNNER_TEMP/ort")" >>"$GITHUB_ENV"

      - name: מטמון חבילת הקול
        uses: actions/cache@v6
        with:
          path: .cache/voice-pack
          key: ${{ env.PACK_CACHE_KEY }}
      - name: הורדת חבילת הקול ואימותה
        run: bash installer/fetch-pack.sh .cache/voice-pack dist/pack

      - name: אריזה (.pkg)
        run: |
          args=(--bin dist/otzaria-voice --version "$VERSION" --arch arm64 --ort "$ORT_DIR")
          bash installer/macos/package.sh "${args[@]}" --out out/without-models
          bash installer/macos/package.sh "${args[@]}" --out out/with-models --pack dist/pack
          ls -l out/*

      - name: בדיקת ההתקנה (pkg)
        run: |
          sudo installer -pkg "$(ls out/with-models/*.pkg)" -target /
          app="/Applications/Otzaria Voice.app"
          test -x "$app/Contents/MacOS/otzaria-voice"
          test -e "$app/Contents/Frameworks/libonnxruntime.dylib"
          test -f "$app/Contents/Resources/pack/ctc/model.int8.onnx"
          plutil -lint /Library/LaunchAgents/org.otzaria.voice.plist
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/otzaria-voice" --version

      - name: הכתבה דרך השירות המותקן
        timeout-minutes: 10
        run: bash installer/ci/smoke-test.sh "/Applications/Otzaria Voice.app/Contents/MacOS/otzaria-voice"

      - name: בדיקת הסרה
        run: |
          sudo "/Library/Application Support/OtzariaVoice/uninstall.sh"
          test ! -e "/Applications/Otzaria Voice.app"
          sudo installer -pkg "$(ls out/without-models/*.pkg)" -target /
          test -x "/Applications/Otzaria Voice.app/Contents/MacOS/otzaria-voice"
          sudo "/Library/Application Support/OtzariaVoice/uninstall.sh"

      - name: העלאה — עם מודלים
        uses: actions/upload-artifact@v7
        with:
          name: otzaria-voice-macos-arm64-with-models
          path: out/with-models/*.pkg
          compression-level: 0
          if-no-files-found: error
      - name: העלאה — בלי מודלים
        uses: actions/upload-artifact@v7
        with:
          name: otzaria-voice-macos-arm64-without-models
          path: out/without-models/*.pkg
          if-no-files-found: error

  android:
    name: Android
    needs: detect
    if: needs.detect.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # No Gradle wrapper is committed: use a Gradle that fits AGP 8.5 (needs 8.7+).
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: מטמון חבילת הקול
        uses: actions/cache@v6
        with:
          path: .cache/voice-pack
          key: ${{ env.PACK_CACHE_KEY }}
      - name: הורדת חבילת הקול ואימותה
        run: bash installer/fetch-pack.sh .cache/voice-pack dist/pack

      # Both APKs are debug-signed (installable by side-loading; no release key in CI).
      # The with-models APK carries the voice pack in assets/pack/ of the "app" module.
      - name: בניית ה-APK
        working-directory: service/android
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; g=./gradlew; else g=gradle; fi
          out="$GITHUB_WORKSPACE/out"; mkdir -p "$out"
          apk() { find . -path '*/build/outputs/apk/*' -name '*.apk' ! -name '*androidTest*' -newer "$1" | head -n1; }
          touch "$RUNNER_TEMP/t0"
          $g --no-daemon assembleDebug
          a="$(apk "$RUNNER_TEMP/t0")"; [ -n "$a" ] || { echo "::error::no APK built"; exit 1; }
          cp "$a" "$out/otzaria-voice-android-without-models-$VERSION.apk"
          assets=app/src/main/assets/pack
          rm -rf "$assets" && mkdir -p "$assets" && cp -a "$GITHUB_WORKSPACE/dist/pack/." "$assets/"
          touch "$RUNNER_TEMP/t1"
          $g --no-daemon assembleDebug
          a="$(apk "$RUNNER_TEMP/t1")"; [ -n "$a" ] || { echo "::error::no APK built"; exit 1; }
          cp "$a" "$out/otzaria-voice-android-with-models-$VERSION.apk"
          rm -rf "$assets"
          ls -l "$out"
          for f in "$out"/*.apk; do
            echo "== $f"; unzip -l "$f" | grep -E 'lib/arm64-v8a/|assets/pack/ctc/model' || true
            unzip -l "$f" | grep -q 'lib/arm64-v8a/libotzaria_voice.so' || { echo "::error::$f: no libotzaria_voice.so"; exit 1; }
            unzip -l "$f" | grep -q 'lib/arm64-v8a/libonnxruntime.so' || { echo "::error::$f: no libonnxruntime.so"; exit 1; }
          done
          unzip -l "$out"/*with-models*.apk | grep -q 'assets/pack/ctc/model.int8.onnx' || { echo "::error::with-models APK has no pack"; exit 1; }

      - name: העלאה — עם מודלים
        uses: actions/upload-artifact@v7
        with:
          name: otzaria-voice-android-with-models
          path: out/otzaria-voice-android-with-models-*.apk
          compression-level: 0
          if-no-files-found: error
      - name: העלאה — בלי מודלים
        uses: actions/upload-artifact@v7
        with:
          name: otzaria-voice-android-without-models
          path: out/otzaria-voice-android-without-models-*.apk
          if-no-files-found: error

  android-test:
    name: Android — בדיקה באמולטור
    needs: [detect, android]
    if: needs.detect.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: otzaria-voice-android-with-models
          path: apk
      - name: הפעלת KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: התקנה והכתבה באמולטור
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disk-size: 6G
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash installer/ci/android-smoke.sh "$(ls apk/*.apk)"

  release:
    name: GitHub Release (שירות)
    needs: [detect, windows-arm64-build, windows, windows-no-vcredist, windows-arm64-test, linux, macos, android, android-test]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: service-v${{ needs.detect.outputs.version }}
      LEGACY_TAG: v${{ needs.detect.outputs.version }}
    steps:
      - name: האם ה-Release כבר קיים
        id: check
        run: |
          # LEGACY_TAG: releases made before the split were tagged v<version>.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
             gh release view "$LEGACY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ה-Release של השירות כבר קיים - מדלג (כדי לפרסם גרסה חדשה מעלים את kVersion ב-service/src/common/service.cpp)."
            echo "exists=true" >>"$GITHUB_OUTPUT"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi

      - name: הורדת כל הקבצים
        if: steps.check.outputs.exists == 'false'
        uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true

      - name: יצירת ה-Release
        if: steps.check.outputs.exists == 'false'
        run: |
          # The ARM64 build ships inside the Windows installers only: alone,
          # started by hand, it would install itself without the x64 build.
          rm -f files/otzaria-voice-arm64.exe
          # The full installer under a name without the version too, so that
          # releases/latest/download/otzaria-voice-windows-x64-with-models.exe
          # always fetches the newest. Made here, not in the Windows job, so the
          # artifact the test jobs download stays one copy.
          cp "files/otzaria-voice-windows-x64-with-models-${TAG#service-v}.exe" files/otzaria-voice-windows-x64-with-models.exe
          ls -l files
          (cd files && sha256sum * >SHA256SUMS.txt)
          cat >notes.md <<EOF
          ## שירות הדיבור — $TAG

          השירות משרת שני תוספים: **חיפוש בדיבור** ו**הקראה קולית**. את התוספים מתקינים מחנות התוספים של אוצריא; את השירות מתקינים פעם אחת מכאן.

          לכל מערכת שני מתקינים:
          - \`with-models\` — כולל את חבילת ההקלדה בדיבור (כ-330 מגה-בייט), עובד מיד גם בלי אינטרנט.
          - \`without-models\` — קטן; כל חבילה תרד בשימוש הראשון בה (הקלדה בדיבור כ-330 מגה-בייט; הקול המוקלט להקראה כ-900 מגה-בייט).

          | מערכת | קובץ |
          |---|---|
          | Windows | \`otzaria-voice-windows-x64-…exe\` |
          | Linux | \`.deb\` (אובונטו/דביאן) או \`.tar.gz\` (כל הפצה) |
          | macOS (Apple silicon) | \`.pkg\` — בפעם הראשונה: קליק ימני ← פתיחה |
          | Android | \`.apk\` |

          הוראות מלאות: https://github.com/$GITHUB_REPOSITORY#readme

          טביעות SHA-256 של כל הקבצים: \`SHA256SUMS.txt\`.
          EOF
          # The plugins download releases/latest/download/<installer>: this release stays "latest".
          gh release create "$TAG" files/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "שירות הדיבור $TAG" --notes-file notes.md --latest
