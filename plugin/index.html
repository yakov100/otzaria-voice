<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>חיפוש בדיבור</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <h1 class="topbar-title">חיפוש בדיבור</h1>
      <span class="topbar-spacer"></span>
      <button class="icon-btn" id="about-btn" type="button" title="אודות">?</button>
    </header>

    <main class="app-content" id="content">
      <section class="dictate">
        <button class="mic" id="mic" type="button" aria-label="התחלת דיבור" disabled>
          <svg viewBox="0 0 24 24" class="mic-icon" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <svg viewBox="0 0 24 24" class="stop-icon" aria-hidden="true">
            <rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/>
          </svg>
        </button>
        <p class="status" id="status" aria-live="polite">בודק את שירות הדיבור…</p>
        <p class="tip muted" id="tip" hidden></p>
      </section>

      <section class="card">
        <div class="transcript" id="transcript" contenteditable="true" spellcheck="false"
             data-placeholder="מה שתאמרו ייכתב כאן. אפשר גם לתקן במקלדת."></div>
        <div class="actions">
          <button class="btn primary" id="search" type="button" disabled>חיפוש בספרייה</button>
          <button class="btn" id="clear" type="button">ניקוי</button>
          <label class="check">
            <input type="checkbox" id="auto">
            <span class="box" aria-hidden="true"></span>
            <span>לחפש מיד בסיום הדיבור</span>
          </label>
        </div>
      </section>

      <section class="card notice" id="notice" hidden>
        <h2 class="card-title" id="notice-title"></h2>
        <p class="muted" id="notice-text"></p>
        <div class="progress" id="progress" hidden><div class="bar" id="bar"></div></div>
        <div class="actions">
          <button class="btn primary" id="download" type="button" hidden>הורדה</button>
          <button class="btn" id="retry" type="button">לבדוק שוב</button>
        </div>
      </section>
    </main>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/dictation.js"></script>
</body>
</html>
